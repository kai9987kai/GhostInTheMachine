name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with test extras)
        run: python -m pip install -e ".[test]"
      - name: Unit and pipeline tests
        run: python -m pytest -q
      - name: Preregistration locks verify (bytes unchanged since locking)
        shell: bash
        run: |
          python src/ghost_in_the_machine_v4.py verify
          python src/ghost_in_the_machine_v5.py verify
          python src/ghost_in_the_machine_v6.py verify
      - name: Claims ledger (every headline number matches its results file)
        run: python tools/claims.py check
      - name: Console scripts installed
        run: ghost-v6 verify
