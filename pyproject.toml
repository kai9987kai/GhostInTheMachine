[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-in-the-machine"
version = "6.0"
description = "Preregistered, null-calibrated experiments on authorship, prediction error and self-model dynamics in synthetic recurrent agents. Nothing here creates, detects or measures consciousness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kai Piper" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
paper = ["pypandoc_binary"]

[project.scripts]
ghost-v4 = "ghost_v4.cli:main"
ghost-v5 = "ghost_v5.cli:main"
ghost-v6 = "ghost_v6.cli:main"

[project.urls]
Repository = "https://github.com/kai9987kai/GhostInTheMachine"

# Install editable (pip install -e .): the locks, preregistrations and results are
# read from the repository tree, so the packages must stay where they are.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ghost_v4", "ghost_v5", "ghost_v6"]
